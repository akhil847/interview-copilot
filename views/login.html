<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Interview Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #16222e; --muted: #5d6b7a; --line: #d5dbe2;
  --accent: #0e6e7e; --accent-ink: #ffffff; --danger: #a5401a;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 22px; }
p.sub { margin: -10px 0 0; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-weight: 400; }
button { padding: 11px 18px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: wait; }
.msg { color: var(--danger); font-size: 14px; min-height: 1.5em; margin: 0; }
</style>
</head>
<body>
<form id="f" novalidate>
  <h1>Interview Copilot</h1>
  <p class="sub">Private. Accounts are created by the admin.</p>
  <label>Username <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label>Password <input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <p class="msg" id="msg" role="alert"></p>
  <button id="b" type="submit">Log in</button>
</form>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), b = document.getElementById('b');
document.getElementById('u').focus();
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  b.disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: f.username.value, password: f.password.value }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Could not log in.');
    location.href = j.mustChangePassword ? '/change-password' : '/';
  } catch (err) {
    msg.textContent = err.message;
    f.password.value = '';
    f.password.focus();
    b.disabled = false;
  }
});
</script>
</body>
</html>
