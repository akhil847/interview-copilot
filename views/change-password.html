<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password · Interview Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #16222e; --muted: #5d6b7a; --line: #d5dbe2;
  --accent: #0e6e7e; --accent-ink: #ffffff; --danger: #a5401a;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
form { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 22px; }
p.sub { margin: -10px 0 0; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-weight: 400; }
.row { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
button { padding: 11px 18px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: wait; }
.link { background: none; color: var(--muted); text-decoration: underline; padding: 4px; font-weight: 400; }
.warn { margin: 0; padding: 10px 12px; background: #fbf0d9; border: 1px solid #ecd49a; border-radius: 8px; font-size: 14px; font-weight: 700; }
.msg { color: var(--danger); font-size: 14px; min-height: 1.5em; margin: 0; }
</style>
</head>
<body>
<form id="f" novalidate>
  <h1>Change password</h1>
  <p class="sub" id="sub">At least 10 characters.</p>
  <p class="warn">Your admin can see this password.</p>
  <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
  <label>New password <input name="next" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>Repeat new password <input name="again" type="password" autocomplete="new-password" required></label>
  <p class="msg" id="msg" role="alert"></p>
  <div class="row">
    <a class="link" id="back" href="/profile">Back</a>
    <button class="link" id="logout" type="button">Log out</button>
    <button id="b" type="submit">Save password</button>
  </div>
</form>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), b = document.getElementById('b');
f.current.focus();
fetch('/api/me').then((r) => (r.ok ? r.json() : null)).then((me) => {
  if (me && me.mustChangePassword) {
    document.getElementById('sub').textContent = 'Choose your own password to continue. At least 10 characters.';
    document.getElementById('back').hidden = true;
  }
});
document.getElementById('logout').onclick = async () => {
  await fetch('/api/logout', { method: 'POST' }).catch(() => {});
  location.href = '/login';
};
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  if (f.next.value !== f.again.value) { msg.textContent = 'The new passwords do not match.'; return; }
  b.disabled = true;
  try {
    const r = await fetch('/api/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current: f.current.value, next: f.next.value }),
    });
    if (r.status === 401) { location.href = '/login'; return; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Could not change the password.');
    location.href = '/';
  } catch (err) {
    msg.textContent = err.message;
    b.disabled = false;
  }
});
</script>
</body>
</html>
